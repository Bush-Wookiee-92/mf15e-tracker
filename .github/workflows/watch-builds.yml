name: Watch for new Modern F-15E builds

# Runs on GitHub's servers every 5 minutes (GitHub may delay scheduled runs a little),
# and can be started by hand from the Actions tab.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch-builds
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Look up the newest builds
        env:
          TESTER_TOKEN: ${{ secrets.TESTER_TOKEN }}
        run: python3 .github/scripts/check_builds.py

      - name: Publish build.json if a build changed
        run: |
          if [ -n "$(git status --porcelain build.json)" ]; then
            git config user.name "build-watch"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add build.json
            git commit -m "New build detected: $(python3 -c 'import json;d=json.load(open("build.json"));print(", ".join(k+" "+v for k,v in d.items()))')"
            git push
          fi
