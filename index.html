/* VOICE occasion: a campaign map the team is proud of, loud but exact
   IDEA a night-ops sector map: every feature we added is a hex sector on one route, from founding (March 2026) to 2.6.9, then locked sectors ahead
   PICTURE a tilted honeycomb of photo hexes over an endlessly drifting topo/radar background, with a selected-sector panel below
   COLOUR near-black steel ground, gunmetal hexes, afterburner gold for the route and current build, HUD green for online, cyan for in work
   TYPE Barlow Condensed (italic for big labels) + Barlow
   LAYOUT top bar, map full width, sector panel (emblem | details + photos | build counter); one column under 760px, flat map on phones */
:root{color-scheme:dark;--bg:#06080a;--steel:#1a2025;--steel2:#252d33;--edge:#3b464d;--ink:#eef2f4;--mut:#9aa7ae;--gold:#ffbf3f;--burn:#ff6a1a;--grn:#7ed68e;--cyn:#62c9ec}
*{box-sizing:border-box;min-width:0}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,"Segoe UI",system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{display:block;max-width:100%}
a{color:var(--cyn)}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:radial-gradient(ellipse at 60% 40%,#121a1f 0%,#06080a 70%)}
.bg>div{position:absolute}
.sweep{opacity:.45;left:50%;top:45%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;border-radius:50%;background:conic-gradient(from 0deg,rgba(255,191,63,0) 0deg,rgba(255,191,63,0) 300deg,rgba(255,150,40,.10) 350deg,rgba(255,210,120,.22) 360deg);animation:spin 12s linear infinite}
.scan{left:0;right:0;height:140px;top:0;background:linear-gradient(180deg,transparent,rgba(126,214,142,.06),transparent);animation:scan 9s linear infinite}
.sit{position:absolute;inset:0;width:100%;height:100%}
.sit .pan{animation:pan 80s ease-in-out infinite alternate}
.sit .sym{opacity:.92}
@keyframes pan{from{transform:translate(0,0)}to{transform:translate(-46px,-28px)}}
.mfd{position:absolute;inset:0;display:none;font:700 17px/1 "Barlow Condensed",sans-serif;color:#f2f5f6}
.mfd b{position:absolute;background:#000;padding:4px 7px;font-weight:700;letter-spacing:.04em}
.mfd .v{writing-mode:vertical-rl;text-orientation:upright;padding:7px 4px;letter-spacing:0}
.mfd i{position:absolute;font-style:normal;white-space:pre;line-height:1.15;text-shadow:0 0 4px #000}
@media(min-width:1500px){.mfd{display:block}}
.sit text{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600}
.vig{inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(0,0,0,.75) 100%)}
@keyframes drift{to{transform:translate(640px,640px)}}
@keyframes drift2{to{transform:translate(512px,-512px)}}
@keyframes fall{to{transform:translateY(104px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes scan{from{transform:translateY(-160px)}to{transform:translateY(100vh)}}
@keyframes twinkle{from{opacity:.15}to{opacity:1}}
@keyframes glow{from{opacity:.35}to{opacity:1}}
@keyframes flow{0%,100%{opacity:.25}50%{opacity:1}}
.app{position:relative;z-index:1}
.wrap{max-width:1280px;margin:0 auto;padding:0 max(3vw,16px)}

.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}

.brand span{font:italic 700 clamp(22px,3vw,30px)/1 "Barlow Condensed",sans-serif;color:var(--burn)}
.brand small{font-size:14px;color:var(--mut);flex-basis:100%}
.top,.msg{text-shadow:0 1px 3px #000,0 0 10px #000}
.brand b{text-shadow:none;filter:drop-shadow(0 2px 6px #000)}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:1px solid var(--edge);background:rgba(20,26,30,.8);border-radius:4px;font-size:15px;white-space:nowrap}

.msg{font-size:14px;color:var(--mut);margin:4px 0 0}

.stage{position:relative;margin:8px 0 0;perspective:1500px}

.fr,.fc,.gl{position:absolute;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.fr{inset:0;background:linear-gradient(160deg,#59666e,#2a3237 60%,#4a565d)}

.cd{position:absolute;top:15%;left:0;right:0;text-align:center;font:700 max(12px,calc(var(--w)*.065))/1 "Barlow Condensed",sans-serif;color:#d8e0e4;white-space:nowrap}

.vv{position:absolute;left:0;right:0;bottom:12%;text-align:center;font-size:clamp(11px,calc(var(--w)*.055),14px);color:var(--gold);font-weight:600;white-space:nowrap}
.s-planned .fc img{filter:grayscale(1) brightness(.45)}
.s-planned .fr{background:linear-gradient(160deg,#2b3338,#161b1e)}

.s-wip .fr{background:linear-gradient(160deg,#62c9ec,#1d5263 55%,#62c9ec)}
.s-start .fr,.s-current .fr{background:linear-gradient(160deg,#ffe39a,#c77a12 50%,#ffbf3f)}
.s-current .gl,.sel .gl{animation:glow 1.6s ease-in-out infinite alternate}
.sel .fr{background:linear-gradient(160deg,#fff,#ffbf3f 50%,#fff)}
.flag{position:absolute;right:92%;top:50%;transform:translateY(-50%);background:#b8320c;color:#fff;font:700 calc(var(--w)*.075)/1 "Barlow Condensed",sans-serif;padding:7px 16px 7px 10px;clip-path:polygon(0 0,86% 0,100% 50%,86% 100%,0 100%);white-space:nowrap}
.star{position:absolute;right:-6%;top:-9%;width:calc(var(--w)*.46);height:calc(var(--w)*.46);background:linear-gradient(160deg,#fff2c4,#ffbf3f 55%,#c77a12);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);display:grid;place-items:center;color:#2a1a02;font:italic 700 calc(var(--w)*.08)/1 "Barlow Condensed",sans-serif;padding-top:6%}
.chev{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;pointer-events:none;z-index:2;animation:flow 2.4s ease-in-out infinite}
.chev::before{content:"";position:absolute;inset:3px;border-top:4px solid var(--gold);border-right:4px solid var(--gold);transform:rotate(45deg)}
.chev.fut::before{border-color:var(--cyn)}
.panel{display:grid;grid-template-columns:200px minmax(0,1fr) 210px;gap:20px;align-items:start;margin:18px 0 26px;padding:18px;background:linear-gradient(180deg,rgba(26,32,37,.92),rgba(12,16,19,.95));border:1px solid var(--edge);border-radius:6px}

.pt h2{font:700 clamp(30px,4vw,44px)/1.04 "Barlow Condensed",sans-serif;margin:10px 0 2px;letter-spacing:-.01em}

.ib{height:34px;min-width:36px;padding:0 8px;border:1px solid var(--edge);border-radius:4px;background:#1a2025;font-size:16px;font-weight:700}
