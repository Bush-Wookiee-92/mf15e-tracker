/* VOICE occasion: a campaign map the team is proud of, loud but exact
   IDEA a night-ops sector map: every feature we added is a hex sector on one route, from founding (March 2026) to 2.6.9, then locked sectors ahead
   PICTURE a tilted honeycomb of photo hexes over an endlessly drifting topo/radar background, with a selected-sector panel below
   COLOUR near-black steel ground, gunmetal hexes, afterburner gold for the route and current build, HUD green for online, cyan for in work
   TYPE Barlow Condensed (italic for big labels) + Barlow
   LAYOUT top bar, map full width, sector panel (emblem | details + photos | build counter); one column under 760px, flat map on phones */
:root{color-scheme:dark;--bg:#06080a;--steel:#1a2025;--steel2:#252d33;--edge:#3b464d;--ink:#eef2f4;--mut:#9aa7ae;--gold:#ffbf3f;--burn:#ff6a1a;--grn:#7ed68e;--cyn:#62c9ec}

button{cursor:pointer}
img{display:block;max-width:100%}

.sit .pan{animation:pan 80s ease-in-out infinite alternate}

@keyframes pan{from{transform:translate(0,0)}to{transform:translate(-46px,-28px)}}
.mfd{position:absolute;inset:0;display:none;font:700 17px/1 "Barlow Condensed",sans-serif;color:#f2f5f6}

function tileForm(id){const t=T().find(x=>x.id===id)||{id:'',kind:'planned',title:'',ver:'Next',tag:'',cat:'Avionics',img:'maneuver',img2:'',summary:'',details:[],source:''};const f=document.getElementById('frm');
 f.innerHTML='<form class="f" id="tf"><h3>'+(id?'Edit sector':'Add sector')+'</h3><label class="full">Title<input id="f-title" required value="'+esc(t.title)+'"></label><label>Status<select id="f-kind">'+Object.entries(KIND).map(([k,v])=>'<option value="'+k+'"'+(k===t.kind?' selected':'')+'>'+v+'</option>').join('')+'</select></label><label>Version label<input id="f-ver" value="'+esc(t.ver)+'"></label><label>Ribbon<input id="f-tag" value="'+esc(t.tag)+'" placeholder="New weapon"></label><label>Category<select id="f-cat">'+CATS.map(c=>'<option'+(c===t.cat?' selected':'')+'>'+c+'</option>').join('')+'</select></label><label>Main photo<select id="f-img">'+imgOpts(t.img)+'</select></label><label>Second photo<select id="f-img2">'+imgOpts(t.img2)+'</select></label><img class="prev full" id="f-prev" src="'+esc(src(t.img))+'" alt="">'+(FB&&CK.admin?'<label class="full">Upload a photo (sets the main photo)<input type="file" id="f-up" accept="image/*"></label>':'')+'<label class="full">Summary<textarea id="f-sum" style="min-height:70px">'+esc(t.summary)+'</textarea></label><label class="full">Details, one per line<textarea id="f-det">'+esc(t.details.join('\n'))+'</textarea></label><label class="full">Source<input id="f-src" value="'+esc(t.source)+'"></label><div class="row full"><button type="button" class="btn" data-close>Cancel</button><button class="btn on">Save</button></div></form>';
 f.showModal();f.querySelector('#f-img').onchange=e=>{f.querySelector('#f-prev').src=src(e.target.value)};
 const up=f.querySelector('#f-up');if(up)up.onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const r={url:await photoUpload(file)};const s=f.querySelector('#f-img');s.insertAdjacentHTML('beforeend','<option value="'+esc(r.url)+'">Uploaded photo</option>');s.value=r.url;f.querySelector('#f-prev').src=src(r.url)}catch(err){up.insertAdjacentHTML('afterend','<span>Upload failed.</span>')}};
 f.querySelector('#tf').onsubmit=e=>{e.preventDefault();const v=x=>f.querySelector(x).value.trim();const n={id:id||('t'+Date.now().toString(36)),kind:v('#f-kind'),title:v('#f-title'),ver:v('#f-ver'),tag:v('#f-tag'),cat:v('#f-cat'),img:v('#f-img'),img2:v('#f-img2'),summary:v('#f-sum'),details:v('#f-det').split('\n').map(s=>s.trim()).filter(Boolean),source:v('#f-src')};f.close();commit(()=>{const k=idx(id);if(k>=0)S.tiles[k]=n;else{const ci=curI();S.tiles.splice(n.kind==='planned'||ci<0?S.tiles.length:ci,0,n)}if(n.kind==='current')S.meta.current=n.ver;sel=n.id})}}
function exportForm(){const f=document.getElementById('frm');f.innerHTML='<form class="f" id="xf"><h3>Export or import</h3><p class="full" style="margin:0">Copy this text to back up the roadmap or send it to a teammate. To import, paste roadmap text and press Load.</p><label class="full">Roadmap data<textarea id="x-t" style="min-height:260px;font-size:13px">'+esc(JSON.stringify(S,null,1))+'</textarea></label><p class="full msg" id="x-m"></p><div class="row full"><button type="button" class="btn" data-close>Close</button><button type="button" class="btn" id="x-c">Copy</button><button class="btn on">Load</button></div></form>';f.showModal();
 f.querySelector('#x-c').onclick=()=>{navigator.clipboard.writeText(f.querySelector('#x-t').value).then(()=>{f.querySelector('#x-m').textContent='Copied.'},()=>{f.querySelector('#x-t').select();f.querySelector('#x-m').textContent='Copy blocked here: the text is selected, press Ctrl+C.'})};
 f.querySelector('#xf').onsubmit=e=>{e.preventDefault();try{const o=JSON.parse(f.querySelector('#x-t').value);if(!o||!Array.isArray(o.tiles)||!o.meta)throw 0;f.close();commit(()=>{o.credits=Object.assign({},S.credits,o.credits);o.imgmap=Object.assign({},S.imgmap,o.imgmap);S=o})}catch(err){f.querySelector('#x-m').textContent='That text is not roadmap data.'}}}
function step(d){const k=idx(sel)+d;if(k>=0&&k<T().length)select(T()[k].id)}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.close!==undefined){b.closest('dialog').close();return}
 if(d.i){select(d.i);if(innerWidth<=760)document.getElementById('pan').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});return}
 if(ckClick(b,d))return;
 if(d.edit){tileForm(d.edit);return}
 if(d.del){const t=T().find(x=>x.id===d.del);msg='Deleted '+(t?t.title:'sector')+'. Undo brings it back.';commit(()=>{const k=idx(d.del);S.tiles.splice(k,1);sel=(S.tiles[Math.max(0,k-1)]||{}).id});return}
 if(d.mv){commit(()=>{const k=idx(sel),j=k+ +d.mv;if(j>=0&&j<S.tiles.length)[S.tiles[k],S.tiles[j]]=[S.tiles[j],S.tiles[k]]});return}
 switch(b.id){case'ed':edit=!edit;msg='';render();break;case'add':tileForm('');break;case'un':if(undo.length){S=JSON.parse(undo.pop());msg='Undone.';persist();render()}break;case'ex':exportForm();break;case'prev':step(-1);break;case'next':step(1);break}});
root.addEventListener('submit',e=>{const f=e.target;if(f.dataset&&f.dataset.form){e.preventDefault();ckSubmit(f)}});
document.addEventListener('keydown',e=>{if(document.querySelector('dialog[open]')||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)});
render();
if(!LOCAL)ckInit();
}</script></body></html>
